name: Monthly Revenue Report (PDF)

on:
  schedule:
    # 6th of each month, 09:07 PHT = 01:07 UTC. Google's earnings report for
    # the prior month lands ~5th; Apple's MONTHLY sales report is available
    # from the 1st–2nd. If Google is late the PDF still ships, marked
    # "not published yet" — re-run manually (workflow_dispatch) once it lands.
    - cron: '7 1 6 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to report (YYYY-MM). Default: previous month.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  monthly-revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Japanese TrueType font for the PDF (reportlab can't embed the OTF/CFF
      # Noto CJK build). DejaVu (₱ glyph) ships with the runner image.
      - name: Install Japanese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-ipafont-gothic fonts-dejavu-core

      - name: Write Google service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/gcp-sa-key.json

      - name: Build and send monthly revenue PDF
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_VENDOR_NUMBER: ${{ secrets.APPLE_VENDOR_NUMBER }}
          APPLE_APP_SKU: ${{ secrets.APPLE_APP_SKU }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
          GOOGLE_PACKAGE_NAME: ${{ secrets.GOOGLE_PACKAGE_NAME }}
          GOOGLE_BUCKET_ID: ${{ secrets.GOOGLE_BUCKET_ID }}
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          HUAWEI_IAP_REPORT_PATH: ${{ vars.HUAWEI_IAP_REPORT_PATH }}
          HUAWEI_IAP_AMOUNT_COLUMN: ${{ vars.HUAWEI_IAP_AMOUNT_COLUMN }}
          HUAWEI_IAP_COUNT_COLUMN: ${{ vars.HUAWEI_IAP_COUNT_COLUMN }}
          HUAWEI_IAP_CURRENCY: ${{ vars.HUAWEI_IAP_CURRENCY }}
          REVENUE_GOOGLE_FEE_RATE: ${{ vars.REVENUE_GOOGLE_FEE_RATE }}
          REVENUE_HUAWEI_FEE_RATE: ${{ vars.REVENUE_HUAWEI_FEE_RATE }}
          REVENUE_FX_OVERRIDES: ${{ vars.REVENUE_FX_OVERRIDES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REVENUE_TELEGRAM_CHAT_ID: ${{ secrets.REVENUE_TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            python -m src.revenue.main monthly --month "${{ inputs.month }}" --out reports
          else
            python -m src.revenue.main monthly --out reports
          fi

      - name: Upload PDF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenue-pdf
          path: reports/*.pdf
          if-no-files-found: ignore
          retention-days: 400

      - name: Commit revenue history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/
          git diff --cached --quiet || git commit -m "chore: update monthly revenue history" && git push

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/gcp-sa-key.json
