name: Daily Download Report

on:
  schedule:
    # 4:37 PM PHT = 8:37 AM UTC (PHT is UTC+8).
    # Earlier + off-peak, odd minute: GitHub queues schedule events on shared
    # runners and delays can reach several hours during busy windows (the old
    # 10:20 UTC slot drifted past midnight PHT). This buffer keeps delivery in
    # the evening. Timing is still best-effort — see external-trigger note below.
    - cron: '37 8 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cumulative totals cache
        uses: actions/cache/restore@v4
        with:
          path: cumulative_totals.json
          key: cumulative-totals-${{ github.ref }}
          restore-keys: |
            cumulative-totals-

      - name: Write Google service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/gcp-sa-key.json

      - name: Run download report
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_VENDOR_NUMBER: ${{ secrets.APPLE_VENDOR_NUMBER }}
          APPLE_APP_SKU: ${{ secrets.APPLE_APP_SKU }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
          GOOGLE_PACKAGE_NAME: ${{ secrets.GOOGLE_PACKAGE_NAME }}
          GOOGLE_BUCKET_ID: ${{ secrets.GOOGLE_BUCKET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      # Independent of the download report: a revenue failure never blocks
      # downloads (and vice-versa). Needs HUAWEI_* secrets for the Huawei line;
      # without them the report still goes out with Apple + Google.
      - name: Run daily revenue report
        if: always()
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_VENDOR_NUMBER: ${{ secrets.APPLE_VENDOR_NUMBER }}
          APPLE_APP_SKU: ${{ secrets.APPLE_APP_SKU }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
          GOOGLE_PACKAGE_NAME: ${{ secrets.GOOGLE_PACKAGE_NAME }}
          GOOGLE_BUCKET_ID: ${{ secrets.GOOGLE_BUCKET_ID }}
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          HUAWEI_UID: ${{ secrets.HUAWEI_UID }}
          HUAWEI_IAP_REPORT_PATH: ${{ vars.HUAWEI_IAP_REPORT_PATH }}
          HUAWEI_IAP_AMOUNT_COLUMN: ${{ vars.HUAWEI_IAP_AMOUNT_COLUMN }}
          HUAWEI_IAP_COUNT_COLUMN: ${{ vars.HUAWEI_IAP_COUNT_COLUMN }}
          HUAWEI_IAP_CURRENCY: ${{ vars.HUAWEI_IAP_CURRENCY }}
          REVENUE_GOOGLE_FEE_RATE: ${{ vars.REVENUE_GOOGLE_FEE_RATE }}
          REVENUE_HUAWEI_FEE_RATE: ${{ vars.REVENUE_HUAWEI_FEE_RATE }}
          REVENUE_FX_OVERRIDES: ${{ vars.REVENUE_FX_OVERRIDES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REVENUE_TELEGRAM_CHAT_ID: ${{ secrets.REVENUE_TELEGRAM_CHAT_ID }}
        run: python -m src.revenue.main daily

      - name: Commit download + revenue history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update download & revenue history" && git push

      - name: Save cumulative totals cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cumulative_totals.json
          key: cumulative-totals-${{ github.ref }}-${{ github.run_id }}

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/gcp-sa-key.json
